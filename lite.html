<script>
// ═════════ CONFIG: UPDATE THESE ═════════
const CFG={firm:'Manan Dua',arn:'ARN-365491',euin:'E699297',email:'wealth@manandua.in',phone:'9310361206',

// ═════════ RISK QUESTIONS (12; scores identical to the original 24-question version) ═════════
const SEC={cap:'Your finances',tol:'Comfort with ups and downs',beh:'Your approach',req:'Your goal',exp:'Your experience'};
const Q=[
{id:'a_income',sec:'cap',l:`How steady is your regular income (salary, pension, rent or business)?`,o:[[`Very steady: pension, government job or established business`,4],[`Mostly steady: private job or regular income`,3],[`Somewhat uncertain: changes from month to month`,2],[`Very uncertain, or no regular income`,1]]},
{id:'a_emergency',sec:'cap',l:`If your income stopped, for how many months could you pay household expenses from savings you can use quickly?`,o:[[`More than 12 months`,4],[`6 to 12 months`,3],[`3 to 6 months`,2],[`Less than 3 months`,1]]},
{id:'a_dependents',sec:'cap',l:`How many people depend on you financially (spouse, children, parents)?`,o:[[`None`,4],[`1 or 2`,3],[`3 or 4`,2],[`5 or more`,1]]},
{id:'a_debt',sec:'cap',l:`How much of your monthly income goes towards loan EMIs?`,o:[[`No loans, or less than 10%`,4],[`10% to 25%`,3],[`26% to 40%`,2],[`More than 40%`,1]]},
{id:'b_fall20',sec:'tol',l:`Markets fall and your investments lose 20% in three months. What would you do?`,o:[[`Sell everything to avoid further loss`,1],[`Sell some to reduce the risk`,2],[`Wait: markets usually recover over time`,3],[`Invest more: prices are lower`,4]]},
{id:'b_comfort',sec:'tol',l:`Which statement is closest to you?`,o:[[`I want steady, predictable returns. Ups and downs worry me.`,1],[`Small ups and downs are fine, but big swings make me nervous.`,2],[`I am fairly comfortable with ups and downs if I invest for 3 years or more.`,3],[`I am comfortable with big ups and downs to earn higher returns.`,4]]},
{id:'b_max_loss',sec:'tol',l:`In one year, what is the most you could lose on your investments and still sleep well? (On ₹10 lakhs, 5% is ₹50,000.)`,o:[[`0 to 5%: I cannot accept any real loss`,1],[`5 to 10%: a small loss is acceptable`,2],[`10 to 20%: a moderate loss is acceptable`,3],[`More than 20%: I think only about the long term`,4]]},
{id:'c_tradeoff',sec:'beh',l:`For every ₹1 lakh invested, which range of yearly results would you be most comfortable with?`,o:[[`Lose up to ₹10,000 in a bad year, gain up to ₹10,000 in a good year`,1],[`Lose up to ₹20,000 in a bad year, gain up to ₹20,000 in a good year`,2],[`Lose up to ₹30,000 in a bad year, gain up to ₹30,000 in a good year`,3],[`Lose ₹40,000 or more in a bad year, gain ₹40,000 or more in a good year`,4]]},
{id:'d_horizon',sec:'req',l:`When will you start needing this money?`,o:[[`Within 2 years`,1],[`In 2 to 5 years`,2],[`In 5 to 10 years`,3],[`After more than 10 years`,4]]},
{id:'d_gap',sec:'req',l:`Compared with your goals, how much growth do you need from these investments?`,o:[[`None: my savings already cover my goals safely`,1],[`A little: moderate growth is enough`,2],[`Good growth: more than safe returns`,3],[`Very high growth: safe returns will not be enough`,4]]},
{id:'e_years',sec:'exp',l:`How long have you been investing?`,o:[[`I have not invested before`,1],[`Less than 3 years`,2],[`3 to 7 years`,3],[`More than 7 years`,4]]},
{id:'e_products',sec:'exp',m:1,l:`Which of these have you invested in?`,o:[[`Only savings account, FDs, PPF or insurance`,1],[`Mutual funds or ETFs`,2],[`Shares, REITs or hybrid funds`,3],[`PMS, AIF, futures & options, structured or global products`,4]]}
];
// Recorded in the audit trail but not scored (horizon is a suitability input, not a risk-appetite input)
const NOSCORE=['d_horizon'];

function secScore(sec){const qs=Q.filter(q=>q.sec===sec&&NOSCORE.indexOf(q.id)<0);let raw=0;
 qs.forEach(q=>{const a=S.ans[q.id];if(a==null)return;raw+=Array.isArray(a)?(a.length?Math.max(...a.map(i=>q.o[i][1])):0):q.o[a][1]});
 const max=qs.length*4,pct=max?raw/max:0;return{raw,max,pct,norm:Math.round(pct*1000)/10,level:pct<.5?'Low':pct<.75?'Moderate':'High'}}
function compute(){const cap=secScore('cap'),tol=secScore('tol'),beh=secScore('beh'),req=secScore('req'),exp=secScore('exp');
 let b=tol.norm,c=beh.norm;const tolAdj=Math.abs(b-c)>15;if(tolAdj){b=c=Math.min(b,c)}
 const ws=cap.norm*.30+b*.25+c*.20+req.norm*.15+exp.norm*.10,O=['Conservative','Moderately Conservative','Moderate','Moderately Aggressive','Aggressive'];
 let p=ws<35?O[0]:ws<50?O[1]:ws<65?O[2]:ws<80?O[3]:O[4],capCap=false;
 if(cap.norm<40&&O.indexOf(p)>2){p='Moderate';capCap=true}
 return{cap,tol,beh,req,exp,ws,tolAdj,capCap,goalMismatch:req.norm-cap.norm>25,profile:p}}
const PDESC={'Conservative':'You prefer to protect your money and are not comfortable with large ups and downs.','Moderately Conservative':'You prefer safety, and can accept small ups and downs for slightly better growth.','Moderate':'You are comfortable with a balance of safety and growth, and can accept moderate ups and downs.','Moderately Aggressive':'You can accept noticeable ups and downs in return for higher long-term growth.','Aggressive':'You can accept large ups and downs in pursuit of high long-term growth.'};

{t:'Risk Profile Assessment',b:['This questionnaire is the distributor’s internal risk-assessment process. It considers your financial circumstances, investment objectives, time horizon, risk tolerance and investment experience. The assessment may be used to support the evaluation of relevant mutual fund schemes against your circumstances and objectives, subject to the applicable regulatory framework. It is not an SEBI-prescribed scoring model.']},
{t:'Client Responsibility Declaration',b:['The information provided by you is true, accurate, and complete to the best of your knowledge.','Incorrect or incomplete information may lead to unsuitable scheme suggestions.','Please let the distributor know if there is a material change in your financial situation, goals, or risk preferences.']},
{t:'Investment Risk Disclaimer',b:['All investments are subject to market risks, including potential loss of capital.','Past performance is not indicative of future results.','The risk profiling process does not guarantee returns or protection from losses.']},
{t:'Suitability Framework & Limitation Clause',b:['Scheme suggestions will take into account your risk profile, financial situation, and stated objectives.','Any investment decision taken outside a suggested scheme is entirely your own discretion and risk.']},
{t:'Periodic Review Clause',b:['Your risk profile should be reviewed periodically and whenever there is a material change in your financial circumstances, investment objectives or risk preferences.','Please proactively let the distributor know about significant changes in income, net worth, financial goals, or risk appetite.']},
{t:'Distributor Remuneration',b:['If you invest in a Regular Plan through the distributor, the distributor may receive commission from the relevant mutual fund/AMC in accordance with the applicable commission structure.','Distribution expenses are reflected in the scheme’s expenses as permitted under applicable regulations.']},
{t:'Data Recording & Audit Trail Consent',b:['You consent to this risk profiling data being recorded and retained as part of the distribution record, as applicable under SEBI and AMFI norms.','You authorise the distributor to use this information to demonstrate suitability in the event of a regulatory review.']},
{t:'Personal Data',b:['We collect and process the personal, financial and investment information provided in this form for client onboarding, KYC-related processes, mutual fund distribution, servicing and applicable regulatory record keeping. The information will be processed in accordance with applicable data-protection and regulatory requirements.','Documents you send us on WhatsApp (such as a cancelled cheque and an identity document) are used only for onboarding and KYC-related processes and kept as required for regulatory record keeping.']}
];

// ═════════ HELPERS ═════════
const er=k=>S.err[k]?`<div class="e" id="e-${k}" role="alert">${S.err[k]}</div>`:'';
const inp=(o,k,l,a={})=>`<label for="${o}-${k}">${l}${a.h?` <span class="hint">${a.h}</span>`:''}</label><input id="${o}-${k}" value="${esc(S[o][k])}" class="${S.err[o+k]?'x':''}" ${a.x||''} oninput="${a.i||`S.${o}.${k}=this.value`}"${S.err[o+k]?` aria-invalid="true" aria-describedby="e-${o+k}"`:''}>${er(o+k)}`;

 const g=(d.mobile||'').replace(/\D/g,'');
 if(d.resStatus==='NRI'?(g.length<8||g.length>15):g.length!==10)e.dmobile=d.resStatus==='NRI'?'Please enter your number with country code (8 to 15 digits).':'Please enter a 10-digit mobile number.';

 :`<canvas id="cv" class="cv" role="img" aria-label="${T('Signature pad. Draw your signature with your finger.','हस्ताक्षर पैड। अपनी उंगली से अपना हस्ताक्षर बनाएँ।')}"></canvas><div class="esb"><span id="sst">${T('Draw your signature above','ऊपर अपना हस्ताक्षर बनाएँ')}</span><button type="button" class="clr" onclick="initCv()">${T('Clear','मिटाएँ')}</button></div>`;

function sMode(m){S.f.mode=m;S.f.drew=0;S.f.sigImg='';$('dec').innerHTML=decl();initCv()}
function initCv(){const c=$('cv');if(!c)return;S.f.drew=0;const dp=Math.min(window.devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*dp;c.height=r.height*dp;const x=c.getContext('2d');x.scale(dp,dp);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.strokeStyle='#1d2e28';x.lineWidth=2.5;x.lineCap=x.lineJoin='round';
 const s=$('sst');if(s){s.textContent=T('Draw your signature above','ऊपर अपना हस्ताक्षर बनाएँ');s.style.color=''}let on=0;const P=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{on=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...P(e))};
 c.onpointermove=e=>{if(!on)return;x.lineTo(...P(e));x.stroke();S.f.drew=1;const t=$('sst');t.textContent=T('✓ Signature captured','✓ हस्ताक्षर दर्ज हुआ');t.style.color='var(--ok)'};

 if(on){const m=['Submitting your form…','Saving your record securely…','Preparing your documents…','Almost done, please wait…'];let k=0;$('busym').textContent=m[0];busy.h=setInterval(()=>{k=Math.min(k+1,3);$('busym').textContent=m[k]},8000)}}
function submit(){if(CFG.webAppUrl.indexOf('PASTE_')>-1){tt('This form is not connected to the server yet.');return}if(!S.rid)S.rid=reqId();busy(true);const tok=S.rid;
 fetch(CFG.webAppUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({payload:payload()})})
 .then(r=>r.json()).then(d=>{if(S.rid!==tok)return;busy(false);
  if(!d||d.ok!==true){tt((d&&d.error)||'Could not submit. Your answers are safe. Please try again.');return}
  S.subId=d.submissionId;S.srvProfile=d.serverProfile||null;S.srvWs=d.serverWs||null;go('done')})
 .catch(()=>{if(S.rid!==tok)return;busy(false);tt('Could not reach the server. Please check your internet and press Submit again. Your answers are safe.')})}

// ═════════ DISPLAY: two simple switches (saved on this device only; no personal data) ═════════
const UI={size:'0',th:'auto'};
try{const s=JSON.parse(localStorage.getItem('mdui')||'{}');if(s.size)UI.size=s.size==='0'?'0':'1';if(s.th==='dark'||s.th==='light')UI.th=s.th}catch(e){}
function applyUI(){const r=document.documentElement,dk=!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),th=UI.th==='auto'?(dk?'dark':'light'):UI.th,a=$('bsz'),b=$('bth');
 r.dataset.size=UI.size;r.dataset.th=th;
 if(a){a.textContent=UI.size==='0'?'Larger text':'Normal text';a.setAttribute('aria-pressed',String(UI.size==='1'))}
 if(b){b.textContent=th==='dark'?'Light mode':'Dark mode';b.setAttribute('aria-pressed',String(th==='dark'))}}
function sv(){try{localStorage.setItem('mdui',JSON.stringify(UI))}catch(e){}applyUI()}
function togSize(){UI.size=UI.size==='0'?'1':'0';sv()}
function togTh(){UI.th=document.documentElement.dataset.th==='dark'?'light':'dark';sv()}
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyUI)}catch(e){}}
// ═════════ READ ALOUD (phone's built-in voice) ═════════
const lsT=()=>{const hi=isHi(),sp=window.speechSynthesis&&speechSynthesis.speaking;return hi?(sp?'रोकें':(S.stage==='rpq'?'प्रश्न सुनें':'पेज सुनें')):(sp?'Stop':S.stage==='rpq'?'Listen to this question':'Listen to this page')};
function listen(){const ss=window.speechSynthesis;if(!ss)return;if(ss.speaking){ss.cancel();$('ls').textContent=lsT();return}
 let t,lang='en-IN';
 if(S.stage==='rpq'){const q=Q[S.qi],H=S.lang==='hi'&&HI[q.id];lang=H?'hi-IN':'en-IN';t=(H?H.l:q.l)+'. '+q.o.map((o,i)=>(H?'विकल्प ':'Option ')+(i+1)+': '+(H?H.o[i]:o[0])).join('. ')}
 else t=$('page').innerText;
 let c='',parts=[];(t.replace(/\s+/g,' ').match(/[^.!?।]+[.!?।]*/g)||[]).forEach(s=>{if((c+s).length>180){if(c)parts.push(c);c=s}else c+=s});if(c)parts.push(c);
 parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x);u.lang=/[\u0900-\u097F]/.test(x)?'hi-IN':'en-IN';u.rate=.9;if(i===parts.length-1)u.onend=u.onerror=()=>{const b=$('ls');if(b)b.textContent=lsT()};ss.speak(u)});
 $('ls').textContent=lsT()}
applyUI();
window.addEventListener('beforeunload',e=>{if(S.stage==='done'||(S.stage==='details'&&!S.d.name&&!S.d.pan&&!S.d.mobile&&!S.d.email))return;e.preventDefault();e.returnValue=''});
render();
